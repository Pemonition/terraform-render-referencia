name: Terraform

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.16"

      - name: Formatação (terraform fmt)
        run: terraform fmt -check -recursive

      - name: Init sem backend (não precisa de chave)
        run: terraform init -backend=false

      - name: Validação (terraform validate)
        run: terraform validate
